# Synthetic demo project for Basket's "Compose Up…" plan sheet (fixtures only).
name: shop

x-defaults: &defaults
  restart: unless-stopped

services:
  web:
    <<: *defaults
    image: nginx:latest
    ports:
      - "8081:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
    depends_on: [api]
    mem_limit: 256m

  api:
    <<: *defaults
    image: python:3.12-slim
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    working_dir: /srv/app
    environment:
      DATABASE_URL: postgresql://shop:${DB_PASSWORD:-shop}@db:5432/shop
      REDIS_URL: redis://cache:6379/0
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    cpus: 2

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shop}
      POSTGRES_DB: shop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    mem_limit: 256m

volumes:
  pgdata:
