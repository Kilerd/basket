name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only superseded PR runs are cancelled: every push to main must finish its leak scan.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  leak-scan:
    name: Leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # --range needs every commit of the PR and the base branch
          persist-credentials: false

      # LEAK_DENYLIST is the private word list (newline-separated, see AGENTS.md §1). It is empty
      # on forks and when unset; the built-in rules (credentials, personal paths, signing
      # identities) still run. The script only prints masked matches and the number of words.
      - name: Scan the working tree
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
        run: scripts/check-leaks.sh --all

      - name: Scan every commit of the pull request
        if: github.event_name == 'pull_request'
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-leaks.sh --range "origin/${BASE_REF}..HEAD"

      # Squash-merge titles and bodies are written at merge time, so check what reached main too.
      # The first push of a branch has an all-zero `before`: scan its whole history then.
      - name: Scan the pushed commits
        if: github.event_name == 'push'
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            scripts/check-leaks.sh --range "${GITHUB_SHA}"
          else
            scripts/check-leaks.sh --range "${BEFORE}..${GITHUB_SHA}"
          fi

  # The release workflow's scripts (release-prep.sh, release-notes.sh, release-ci-check.sh, ...)
  # in throwaway repositories; macOS-only parts (update signature, DMG) run on a Mac locally.
  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the release scripts
        run: scripts/tests/release-prep-test.sh

  build-test:
    name: Build, test and self-test
    # macOS 26 on Apple silicon (the package needs the macOS 26 SDK). Image contents:
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    timeout-minutes: 60
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
      # scripts/_common.sh always uses /Applications/Xcode.app; "Select Xcode" points that path at
      # XCODE_APP so `swift` here and in the scripts is the same toolchain (no second build).
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not on this runner image; installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          if [ -L /Applications/Xcode.app ] || [ ! -e /Applications/Xcode.app ]; then
            sudo ln -sfn "$XCODE_APP" /Applications/Xcode.app
          else
            echo "::warning::/Applications/Xcode.app is not a symlink; scripts/ will use it as is"
          fi
          sudo xcode-select -s /Applications/Xcode.app
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        id: build
        run: swift build

      # Integration tests are opt-in (BASKET_INTEGRATION, BASKET_MIGRATION_LIVE, ...), so they
      # are skipped here: the runner has no `container` system.
      - name: Unit tests
        run: swift test

      # The String Catalog matches the sources (swiftc -emit-localized-strings), every key is
      # translated into every language with matching placeholders, and it compiles.
      - name: Localization check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/check-l10n.sh

      # The self-test opens the app's window in the runner's GUI session. Restored window state
      # (from an earlier launch in this job) can leave the main window closed, which would stall
      # the self-test, so state restoration is turned off for the bundle id of the debug build it
      # runs (dev.basket.app.debug, scripts/_common.sh).
      - name: Prepare the GUI session
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          defaults write dev.basket.app.debug ApplePersistenceIgnoreState -bool YES
          system_profiler SPDisplaysDataType | grep -E 'Resolution|Display Type' || true

      - name: Self-test (demo fixtures)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: caffeinate -d -i -u scripts/selftest.sh demo

      - name: Self-test (empty fixtures)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: caffeinate -d -i -u scripts/selftest.sh empty

      - name: Self-test (stopped fixtures)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: caffeinate -d -i -u scripts/selftest.sh stopped

      # Other languages: Chinese for CJK text, German as the longest labels (truncation).
      - name: Self-test (demo fixtures, Simplified Chinese)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          BASKET_LANGUAGE: zh-Hans
        run: caffeinate -d -i -u scripts/selftest.sh demo

      - name: Self-test (demo fixtures, German)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          BASKET_LANGUAGE: de
        run: caffeinate -d -i -u scripts/selftest.sh demo

      - name: Upload self-test reports and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/selftest/**
          if-no-files-found: warn
          retention-days: 14
